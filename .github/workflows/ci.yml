name: CI

# Thin caller. The gate itself — build brood, `nest check`, `nest format --check`,
# `nest test` — lives once in broodlang/brood/.github/workflows/package-ci.yml, so a
# change to what "green" means is one edit rather than one per repo.
#
# This app is the ecosystem's integration canary: it is the only repo that resolves
# hatch AND store-postgres from the REGISTRY rather than a git pin, so it is where a
# bad publish shows up. It had no CI, and a stale `hatch 0.4.9` pin sat here across
# three releases hiding six unfixed renames behind a dependency too old to resolve.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: broodlang/brood/.github/workflows/package-ci.yml@main
